[project]
name = "jarvis"
version = "0.0.0"
description = "JARVIS - persistent, voice-controlled, AI-powered personal digital assistant (Phase 0 foundation)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: exercises a real local backend (Ollama, a downloaded model file); skips itself when unavailable rather than faking a pass.",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
